# eval 步骤：判断回答是否正确并计算指标（输入是 answer 的产物）
# 用法：python -m codemem.eval [--answers path/to/answers.jsonl] [--no-judge]

# judge 用模型（默认复用与 answer 同一个端点）
judge:
  base_url: http://127.0.0.1:30000/v1
  api_key: sglang
  model: /home/minghaifeng/Train/model/Qwen3-8B
  temperature: 0.0
  max_tokens: 1024
  max_retries: 3
  enable_thinking: false

# judge 并发
concurrency: 8

log:
  level: info
  output: data/eval_runs
